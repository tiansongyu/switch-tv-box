services:
  switch-tv-box-build:
    build:
      context: .
      dockerfile: Dockerfile
    image: switch-tv-box/toolchain:local
    working_dir: /workspace
    environment:
      DEVKITPRO: /opt/devkitpro
      TVBOX_ACTION: release
      BUILD_JOBS: 8
    volumes:
      - ./:/workspace
    command: bash scripts/in-container-build.sh
