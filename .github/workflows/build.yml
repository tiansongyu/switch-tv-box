name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  toolchain:
    uses: ./.github/workflows/toolchain.yml

  build:
    needs: toolchain
    runs-on: ubuntu-latest
    env:
      TOOLCHAIN_IMAGE: ${{ needs.toolchain.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test UI navigation and language
        run: sh scripts/test_ui.sh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test, build and package switch-tv-box
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e DEVKITPRO=/opt/devkitpro \
            -e NXCAST_MIN_NRO_SIZE=5000000 \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            "${TOOLCHAIN_IMAGE}" \
            bash scripts/in-container-build.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: switch-tv-box-${{ github.sha }}
          path: |
            dist/switch-tv-box-sdmc.zip
          if-no-files-found: error
