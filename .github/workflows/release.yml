name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    uses: ./.github/workflows/toolchain.yml

  release:
    needs: toolchain
    runs-on: ubuntu-latest
    env:
      TOOLCHAIN_IMAGE: ${{ needs.toolchain.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test, build and package switch-tv-box
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e DEVKITPRO=/opt/devkitpro \
            -e NXCAST_MIN_NRO_SIZE=5000000 \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            "${TOOLCHAIN_IMAGE}" \
            bash scripts/in-container-build.sh

      - name: Verify complete-release packaging
        run: python3 scripts/test_package_complete_release.py

      - name: Package complete source and runtime release
        run: python3 scripts/package_complete_release.py

      - name: Refuse to replace an already published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # draft:true preserves drafts, but the upload action also reuses
          # published releases. Never replace an already validated public asset.
          # Listing is authenticated and paginated; API failures abort this step.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .tag_name' \
            > "${RUNNER_TEMP}/switch-tv-box-published-tags.txt"
          if grep -Fxq -- "${RELEASE_TAG}" "${RUNNER_TEMP}/switch-tv-box-published-tags.txt"; then
            echo "::error::This tag already has a published release; asset replacement is forbidden."
            exit 1
          fi

      - name: Create draft GitHub Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          name: switch-tv-box ${{ github.ref_name }} - DLNA + IPTV + AirPlay 1
          draft: true
          body_path: .github/release-notes.md
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/switch-tv-box-sdmc.zip
            dist/switch-tv-box-v*-complete.zip
            dist/SHA256SUMS.txt
